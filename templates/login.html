{# [Secções 4 e 11] Formulário de autenticação. #}
{% extends "base.html" %}
{% block title %}Login · NetLearn Battle{% endblock %}
{% block content %}
<section class="form-card">
  <h1>Login</h1>
  <p>Entre para jogar e consultar os seus resultados.</p>
  <form method="post">
    <label>Utilizador<input name="username" required autocomplete="username"></label>
    <label>Password<input type="password" name="password" required autocomplete="current-password"></label>
    <button class="button" type="submit">Entrar</button>
  </form>
  <p>Ainda não tem conta? <a href="{{ url_for('register') }}">Registar</a></p>
</section>
{% endblock %}
